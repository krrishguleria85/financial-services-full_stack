<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Life Insurance Corporation (LIC) of India Official Emblem Structure -->
  <defs>
    <linearGradient id="licGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFDD00"/>
      <stop offset="100%" stop-color="#F5A623"/>
    </linearGradient>
    <linearGradient id="licBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003366"/>
      <stop offset="100%" stop-color="#001F3F"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="24" fill="#ffffff"/>
  <!-- Blue central circle / crest -->
  <circle cx="60" cy="54" r="42" fill="url(#licBlue)"/>
  <!-- Golden hands cupping flame -->
  <!-- Left Hand -->
  <path d="M38,62 C38,72 48,78 60,78 C54,73 50,68 49,60 C46,60 41,58 38,62 Z" fill="url(#licGold)"/>
  <path d="M34,50 C38,50 44,55 46,62 C41,60 36,56 34,50 Z" fill="url(#licGold)"/>
  <!-- Right Hand -->
  <path d="M82,62 C82,72 72,78 60,78 C66,73 70,68 71,60 C74,60 79,58 82,62 Z" fill="url(#licGold)"/>
  <path d="M86,50 C82,50 76,55 74,62 C79,60 84,56 86,50 Z" fill="url(#licGold)"/>
  <!-- Central Flame / Lamp (Deepak) -->
  <ellipse cx="60" cy="58" rx="8" ry="4" fill="url(#licGold)"/>
  <!-- Flame tip -->
  <path d="M60,32 C65,42 67,48 67,54 C67,60 63,61 60,61 C57,61 53,60 53,54 C53,48 55,42 60,32 Z" fill="#ffffff"/>
  <path d="M60,37 C63,44 64,48 64,52 C64,56 62,57 60,57 C58,57 56,56 56,52 C56,48 57,44 60,37 Z" fill="url(#licGold)"/>
  <!-- Bold LIC text -->
  <text x="60" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="900" fill="url(#licGold)" text-anchor="middle" letter-spacing="1">L I C</text>
  <text x="60" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="900" fill="#003366" text-anchor="middle" letter-spacing="1.5">INSURANCE</text>
</svg>
