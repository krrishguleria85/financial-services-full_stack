<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Star Health Emblem -->
  <defs>
    <linearGradient id="starBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003580"/>
      <stop offset="100%" stop-color="#0056b3"/>
    </linearGradient>
    <linearGradient id="starRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ED1C24"/>
      <stop offset="100%" stop-color="#c41219"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="24" fill="#ffffff"/>
  <!-- Circular swirl arc -->
  <circle cx="60" cy="55" r="42" fill="none" stroke="url(#starBlue)" stroke-width="7" stroke-dasharray="190 70" transform="rotate(-40 60 55)"/>
  <!-- Star Symbol in Red -->
  <polygon points="60,24 67,44 89,45 72,58 78,80 60,67 42,80 48,58 31,45 53,44" fill="url(#starRed)"/>
  <!-- Text: STAR HEALTH -->
  <text x="60" y="104" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#003580" text-anchor="middle" letter-spacing="1">STAR HEALTH</text>
</svg>
