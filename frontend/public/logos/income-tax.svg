<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Income Tax Department India Emblem -->
  <defs>
    <linearGradient id="itNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b2545"/>
      <stop offset="100%" stop-color="#133c6d"/>
    </linearGradient>
    <linearGradient id="itGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#DAA520"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="24" fill="#ffffff"/>
  <!-- Central Emblem Ring -->
  <circle cx="60" cy="58" r="44" fill="url(#itNavy)" stroke="url(#itGold)" stroke-width="3"/>
  <circle cx="60" cy="58" r="38" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
  <!-- Ashoka Pillar Symbol Silhouette -->
  <!-- Lions and base -->
  <path d="M50,75 L70,75 L67,65 L53,65 Z" fill="url(#itGold)"/>
  <rect x="52" y="76" width="16" height="2" fill="#ffffff"/>
  <!-- Pillar Body & heads -->
  <path d="M54,65 L54,42 C54,40 56,38 57,36 C56,33 58,31 60,31 C62,31 64,33 63,36 C64,38 66,40 66,42 L66,65 Z" fill="url(#itGold)"/>
  <!-- Side Lions -->
  <path d="M52,43 C49,42 47,45 47,48 C47,53 52,55 54,56 Z" fill="url(#itGold)"/>
  <path d="M68,43 C71,42 73,45 73,48 C73,53 68,55 66,56 Z" fill="url(#itGold)"/>
  <!-- Ashoka Chakra wheel base -->
  <circle cx="60" cy="70" r="3.5" fill="#ffffff"/>
  <circle cx="60" cy="70" r="1.5" fill="#0b2545"/>
  <!-- Laurel / Wheat Garland on sides -->
  <path d="M30,58 C30,42 42,30 50,26" fill="none" stroke="url(#itGold)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M90,58 C90,42 78,30 70,26" fill="none" stroke="url(#itGold)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Banner Text -->
  <text x="60" y="93" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">INCOME TAX</text>
  <text x="60" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="900" fill="#0b2545" text-anchor="middle" letter-spacing="1">ITR e-FILING</text>
</svg>
