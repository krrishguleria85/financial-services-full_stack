services:
  # ---------------------------------------------
  # Backend API Web Service
  # ---------------------------------------------
  - type: web
    name: financial-services-api
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: financial-services-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false
        # Set this to your frontend URL e.g. https://financial-services-web.onrender.com

  # ---------------------------------------------
  # Frontend Static Site
  # ---------------------------------------------
  - type: static
    name: financial-services-web
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        # Set this to your backend API URL e.g. https://financial-services-api.onrender.com/api
        sync: false

databases:
  - name: financial-services-db
    plan: free
